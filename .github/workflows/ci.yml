
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All project files exist!"
